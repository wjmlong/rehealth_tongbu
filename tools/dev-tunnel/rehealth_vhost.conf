# ECS nginx vhost for the ReHealth dev tunnel.
# Deployed at: /www/server/panel/vhost/nginx/rehealth.conf (BT-panel managed nginx)
# Reload with: nginx -t && nginx -s reload
server {
    listen 80;
    server_name rehealth.47.80.30.228.sslip.io rehealth.youngjimmy.store;

    access_log /www/wwwlogs/rehealth_access.log;
    error_log /www/wwwlogs/rehealth_error.log;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
        client_max_body_size 50m;
    }
}
