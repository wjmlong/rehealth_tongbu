# ECS nginx vhost for the ReHealth dev tunnel (HTTP + HTTPS).
# Deployed at: /www/server/panel/vhost/nginx/rehealth.conf (BT-panel managed nginx)
# Cert issued by acme.sh (Let's Encrypt), installed to /etc/nginx/ssl/rehealth/.
# Auto-renew: acme.sh cron renews and reloads nginx via --reloadcmd.
# Reload with: nginx -t && nginx -s reload

server {
    listen 80;
    server_name rehealth.47.80.30.228.sslip.io rehealth.youngjimmy.store;

    access_log /www/wwwlogs/rehealth_access.log;
    error_log /www/wwwlogs/rehealth_error.log;

    # ACME http-01 challenge (must stay reachable over plain HTTP)
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/rehealth_acme;
    }

    # Everything else: redirect to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name rehealth.47.80.30.228.sslip.io rehealth.youngjimmy.store;

    ssl_certificate /etc/nginx/ssl/rehealth/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/rehealth/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    access_log /www/wwwlogs/rehealth_access.log;
    error_log /www/wwwlogs/rehealth_error.log;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
        client_max_body_size 50m;
    }
}
