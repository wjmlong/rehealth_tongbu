org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.overridePathCheck=true
android.suppressUnsupportedCompileSdk=36

# Default Debug builds to the HTTPS dev-tunnel used by physical-device QA.
# Local emulator/USB development can override this in the ignored local.properties.
rehealth.api.base.url=https://rehealth.youngjimmy.store/jeecg-boot/

# Production Release endpoint. Override only for an explicitly approved environment.
rehealth.release.api.base.url=https://rehealth.youngjimmy.store/jeecg-boot/

# Release identity defaults. CI or local.properties may override both values.
rehealth.version.code=1
rehealth.version.name=1.0.0
