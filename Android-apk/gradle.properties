org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.overridePathCheck=true
android.suppressUnsupportedCompileSdk=36

# Committed default backend base URL for internal (alpha) testing.
# Overridable per-machine via Android-apk/local.properties (rehealth.api.base.url)
# or the REHEALTH_API_BASE_URL environment variable.
rehealth.api.base.url=https://rehealth.youngjimmy.store/jeecg-boot/

# Committed Release backend base URL for internal (alpha) testing. Must be HTTPS
# (enforced by the build gate). Overridable via rehealth.release.api.base.url in
# local.properties or the REHEALTH_RELEASE_API_BASE_URL environment variable.
rehealth.release.api.base.url=https://rehealth.youngjimmy.store/jeecg-boot/
