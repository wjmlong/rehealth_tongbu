org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.overridePathCheck=true
android.suppressUnsupportedCompileSdk=36

# Default to the local emulator-to-host endpoint. Physical devices can override this
# in the ignored local.properties and use adb reverse for 127.0.0.1:8080.
rehealth.api.base.url=http://10.0.2.2:8080/jeecg-boot/

# Release must fail closed until an explicit HTTPS environment is selected.
# Override via local.properties or REHEALTH_RELEASE_API_BASE_URL when publishing.
rehealth.release.api.base.url=https://api.rehealth.invalid/
