rehealth:
  runtime:
    mode: staging
  demo:
    enabled: false
  software-db:
    enabled: ${REHEALTH_SOFTWARE_DB_ENABLED:false}
  device-service:
    enabled: ${REHEALTH_DEVICE_SERVICE_ENABLED:false}
    base-url: ${REHEALTH_DEVICE_SERVICE_BASE_URL:}
    internal-token-file: ${REHEALTH_DEVICE_SERVICE_INTERNAL_TOKEN_FILE:${REHEALTH_INTERNAL_SERVICE_CREDENTIAL_FILE:}}
    timeout-seconds: ${REHEALTH_DEVICE_SERVICE_TIMEOUT_SECONDS:5}
  timescale:
    enabled: ${REHEALTH_TIMESCALE_ENABLED:false}
  model-service:
    base-url: ${REHEALTH_MODEL_SERVICE_BASE_URL:}
    require-real-model: ${REHEALTH_REQUIRE_REAL_MODEL:false}
  health-agent:
    engine: ${REHEALTH_HEALTH_AGENT_ENGINE:langchain4j}
    internal-token-file: ${REHEALTH_AGENT_INTERNAL_TOKEN_FILE:${REHEALTH_INTERNAL_SERVICE_CREDENTIAL_FILE:}}
    langchain4j:
      base-url: ${REHEALTH_LLM_BASE_URL:https://api.deepseek.com}
      api-key: ""
      api-key-file: ${REHEALTH_LLM_API_KEY_FILE:}
      model: ${REHEALTH_LLM_MODEL:deepseek-v4-flash}
      timeout-seconds: ${REHEALTH_LLM_TIMEOUT_SECONDS:20}
      max-tokens: ${REHEALTH_LLM_MAX_TOKENS:800}
    rate-limit:
      requests: ${REHEALTH_AGENT_RATE_LIMIT_REQUESTS:20}
      window-seconds: ${REHEALTH_AGENT_RATE_LIMIT_WINDOW_SECONDS:60}
  vision:
    enabled: ${REHEALTH_VISION_ENABLED:false}
    base-url: ${REHEALTH_VISION_BASE_URL:}
    api-key: ""
    api-key-file: ${REHEALTH_VISION_API_KEY_FILE:}
    model: ${REHEALTH_VISION_MODEL:gpt-5.6-luna}
    timeout-seconds: ${REHEALTH_VISION_TIMEOUT_SECONDS:75}
    max-tokens: ${REHEALTH_VISION_MAX_TOKENS:1200}
    max-image-bytes: ${REHEALTH_VISION_MAX_IMAGE_BYTES:4194304}
  attribution-service:
    base-url: ${REHEALTH_ATTRIBUTION_SERVICE_BASE_URL:}
    internal-token-file: ${REHEALTH_INTERNAL_SERVICE_CREDENTIAL_FILE:}
  attribution:
    mode: pias
    provenance: pias
  provider-credentials:
    embedded-secret: ""
