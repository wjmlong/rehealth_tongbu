spring:
  application:
    name: jeecg-system
  config:
    import: optional:classpath:config/application-liteflow.yml
  profiles:
    active: '@profile.name@'

# ReHealth：跨服务聚合用户健康数据所需配置
# base-url 指向 device-service 地址；credential 必须与 device-service 的
# rehealth.identity.service-credential 配置值一致（建议在部署环境用环境变量注入）。
rehealth:
  device-service:
    base-url: http://localhost:8082
    credential: ${REHEALTH_DEVICE_CREDENTIAL:}

# 阿里云短信仅在服务端启用。生产凭据优先从挂载的 secret 文件读取，
# 不得复用 OSS AccessKey，也不得写入 Android 包或受版本控制的配置。
jeecg:
  sms:
    # 注册验证码使用号码认证服务 Dypnsapi；赠送签名/模板不能与下方 Dysmsapi 混用。
    dypns:
      enabled: ${JEECG_SMS_DYPNS_ENABLED:false}
      access-key-id: ${JEECG_SMS_DYPNS_ACCESS_KEY_ID:}
      access-key-secret: ${JEECG_SMS_DYPNS_ACCESS_KEY_SECRET:}
      access-key-id-file: ${JEECG_SMS_DYPNS_ACCESS_KEY_ID_FILE:}
      access-key-secret-file: ${JEECG_SMS_DYPNS_ACCESS_KEY_SECRET_FILE:}
      endpoint: ${JEECG_SMS_DYPNS_ENDPOINT:dypnsapi.aliyuncs.com}
      country-code: ${JEECG_SMS_DYPNS_COUNTRY_CODE:86}
      sign-name: ${JEECG_SMS_DYPNS_SIGN_NAME:}
      register-template-code: ${JEECG_SMS_DYPNS_REGISTER_TEMPLATE_CODE:100001}
      scheme-name: ${JEECG_SMS_DYPNS_SCHEME_NAME:rehealth-register}
      code-length: ${JEECG_SMS_DYPNS_CODE_LENGTH:6}
      valid-minutes: ${JEECG_SMS_DYPNS_VALID_MINUTES:5}
      interval-seconds: ${JEECG_SMS_DYPNS_INTERVAL_SECONDS:60}
    # Jeecg 旧登录/找回密码入口仍使用标准短信服务 Dysmsapi。
    aliyun:
      enabled: ${JEECG_SMS_ALIYUN_ENABLED:false}
      access-key-id: ${JEECG_SMS_ALIYUN_ACCESS_KEY_ID:}
      access-key-secret: ${JEECG_SMS_ALIYUN_ACCESS_KEY_SECRET:}
      access-key-id-file: ${JEECG_SMS_ALIYUN_ACCESS_KEY_ID_FILE:}
      access-key-secret-file: ${JEECG_SMS_ALIYUN_ACCESS_KEY_SECRET_FILE:}
      sign-name: ${JEECG_SMS_ALIYUN_SIGN_NAME:}
      register-template-code: ${JEECG_SMS_ALIYUN_REGISTER_TEMPLATE_CODE:}
      login-template-code: ${JEECG_SMS_ALIYUN_LOGIN_TEMPLATE_CODE:}
      change-password-template-code: ${JEECG_SMS_ALIYUN_CHANGE_PASSWORD_TEMPLATE_CODE:}
